<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин ULTRA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    <h1>🛒 Магазин электроники</h1>
    <div class="cart-icon">
        🛒 <span id="cart-count">0</span>
    </div>
</header>
    
    <main>
    <div class="filters">
        <button class="filter-btn active" data-category="all">Все</button>
        <button class="filter-btn" data-category="laptops">Ноутбуки</button>
        <button class="filter-btn" data-category="phones">Смартфоны</button>
        <button class="filter-btn" data-category="accessories">Аксессуары</button>
    </div>
    
    <div class="cards-container">
        <!-- Сюда JavaScript вставит карточки -->
    </div>
</main>
    
<!-- Панель корзины -->
<div class="cart-overlay" id="cart-overlay"></div>
<div class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <h2>Корзина</h2>
        <button class="close-cart-btn" id="close-cart-btn">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
        <!-- Сюда JavaScript вставит товары -->
    </div>
    <div class="cart-footer">
        <div class="cart-total">
            <span>Итого:</span>
            <span id="cart-total-price">0 ₽</span>
        </div>
        <button class="checkout-btn">Оформить заказ</button>
    </div>
</div>
<!-- Модальное окно оформления заказа -->
<div class="modal-overlay" id="checkout-overlay"></div>
<div class="modal" id="checkout-modal">
    <div class="modal-header">
        <h2>Оформление заказа</h2>
        <button class="close-modal-btn" id="close-checkout-btn">✕</button>
    </div>
    <form id="checkout-form" class="checkout-form">
        <div class="form-group">
            <label for="customer-name">Ваше имя *</label>
            <input type="text" id="customer-name" name="name" required>
        </div>
        <div class="form-group">
            <label for="customer-phone">Телефон *</label>
            <input type="tel" id="customer-phone" name="phone" placeholder="+7 (999) 123-45-67" required>
        </div>
        <div class="form-group">
            <label for="customer-address">Адрес доставки *</label>
            <textarea id="customer-address" name="address" rows="3" required></textarea>
        </div>
        <div class="order-summary">
            <h3>Ваш заказ</h3>
            <div id="order-items">
                <!-- Сюда JavaScript вставит список товаров -->
            </div>
            <div class="order-total">
                <span>Итого:</span>
                <span id="order-total-price">0 ₽</span>
            </div>
        </div>
        <button type="submit" class="submit-order-btn">Подтвердить заказ</button>
    </form>
</div>
<script src="script.js"></script>
</body>
</html>
